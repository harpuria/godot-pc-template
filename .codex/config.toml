[mcp_servers.godot-ai]
command = "uvx"
args = [
  "--isolated", "--no-config", "--no-env-file", "--no-sources", "--no-build",
  "--index-strategy", "first-index", "--keyring-provider", "disabled",
  "--exclude-newer", "2026-11-16T18:00:00Z", "--exclude-newer-package", "godot-ai=false",
  "--python", ">=3.11,<3.15",
  "--index", "https://pypi.org/simple", "--default-index", "https://pypi.org/simple",
  "--find-links", "https://pypi.org/simple/godot-ai/",
  "--link-mode", "copy", "--from", "godot-ai==4.4.2",
  "godot-ai", "attach", "--port", "8000", "--ws-port", "9500",
]
env_vars = ["GODOT_AI_CAPABILITY_DIR", "GODOT_AI_DISABLE_TELEMETRY", "UV_CACHE_DIR", "XDG_CONFIG_HOME", "XDG_CACHE_HOME"]
startup_timeout_sec = 60
tool_timeout_sec = 360
