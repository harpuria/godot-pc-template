# 공통 회귀 검사(headless + Xvfb GUI)와 configure·번역·고지 리소스 일관성을 Linux Godot으로 확인한다.
# export·서명·Windows/macOS 실행은 검사하지 않는다(docs/DISTRIBUTION.md 참고).
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Read Godot version
        id: godot
        run: echo "version=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/godot
          key: godot-${{ steps.godot.outputs.version }}-linux-x86_64-verified

      - name: Download and verify Godot
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.godot.outputs.version }}
        run: |
          mkdir -p ~/godot /tmp/godot-dl
          ARCHIVE="Godot_v${VERSION}-stable_linux.x86_64.zip"
          BASE_URL="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable"
          curl -fsSL -o "/tmp/godot-dl/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          curl -fsSL "${BASE_URL}/SHA512-SUMS.txt" | grep -F "  ${ARCHIVE}" > /tmp/godot-dl/godot.sha512
          (cd /tmp/godot-dl && sha512sum -c godot.sha512)
          unzip -q "/tmp/godot-dl/${ARCHIVE}" -d ~/godot
          mv ~/godot/Godot_v${VERSION}-stable_linux.x86_64 ~/godot/godot
          rm -rf /tmp/godot-dl

      - name: Ensure Xvfb
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi

      - name: Regression checks (headless + Xvfb GUI)
        run: xvfb-run -a env GODOT="$HOME/godot/godot" tools/validate.sh --gui

      - name: Configure and generated resources are repeatable
        run: |
          "$HOME/godot/godot" --headless --path . --script res://tools/configure.gd
          "$HOME/godot/godot" --headless --path . --script res://tools/write_engine_notices.gd
          git diff --exit-code -- project.godot export_presets.cfg ui/i18n/ third_party/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-logs
          path: build/validation_logs/
          if-no-files-found: ignore
