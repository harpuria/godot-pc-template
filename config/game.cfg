[app]
name="godot-pc-template"
version="0.1.0"
; 배포 후 이름을 바꾸더라도 저장 위치가 유지되도록 고정한다.
data_directory="godot-pc-template"
executable_name="pc-template"
macos_bundle="com.example.pctemplate"
main_scene="res://scenes/main.tscn"
; RefCounted의 before_app_initialize() -> Dictionary가 {"error": OK}를 반환해야 진입한다.
init_script=""

[display]
viewport_width=1280
viewport_height=720
window_width=1280
window_height=720
minimum_width=960
minimum_height=540
default_mode="windowed"
default_vsync=true
default_max_fps=0

[input]
controller_deadzone=0.2

[export]
; 게임 JSON·CSV 등 추가 파일을 필요할 때 포함한다.
extra_include_filter=""
extra_exclude_filter=""
; 게임 main_scene으로 바꾼 뒤 true로 설정하면 데모 장면·음원을 배포에서 제외한다.
exclude_demo=false
; Steam SDK를 추가한 게임은 해당 addon 경로를 지정하여 다른 채널에서 제외한다.
steam_only_filter=""

[lifecycle]
; focus pause와 오디오 정지는 독립적이다. menu/overlay pause는 오디오도 정지한다.
pause_on_focus_loss=true
mute_on_focus_loss=true

[save]
autosave_seconds=30.0

[features]
store_enabled=true

[distribution]
; export feature(standalone/itch/steam)가 최우선이다. Editor의 auto는 standalone이다.
channel="auto"

[services]
; Debug에서만 Mock을 사용한다. SDK 없는 Release는 unavailable이다.
mode="mock"

[store]
achievement_ids={"DEMO_FIRST_WIN": "DEMO_FIRST_WIN"}
leaderboard_ids={"DEMO_SCORE": "DEMO_SCORE"}
timeout_seconds=15.0
